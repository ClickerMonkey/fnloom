<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the hub serves the manifest with its display name, and replaces the title and app title below with it -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harness" />
    <title>Harness</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- zod runs jitless before any module loads: the hub's CSP forbids eval (see public/zod-config.js) -->
    <script src="/zod-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
