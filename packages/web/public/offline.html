<!doctype html>
<!--
  What the installed app shows when it can't reach the hub (the service worker answers a page load with this when the
  network fails). Self-contained: the service worker keeps only this page, never the app or its data.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Can't reach your hub</title>
    <style>
      :root { color-scheme: light dark; --bg: light-dark(#f9fafb, #0c0d10); --text: light-dark(#2a2b31, #eeeff2); --dim: light-dark(#5f6069, #aeb0b8); --accent: light-dark(#4767d3, #8ea4f0); --on-accent: light-dark(#fff, #0c0d10); }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { display: grid; justify-items: center; gap: 12px; max-width: 26rem; text-align: center; }
      svg { width: 64px; height: 64px; }
      h1 { margin: 8px 0 0; font-size: 1.375rem; }
      p { margin: 0; color: var(--dim); }
      a { margin-top: 12px; padding: 10px 20px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid color-mix(in oklab, var(--accent) 40%, transparent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main data-testid="offline-page">
      <!-- the mark, inline: nothing else can load while the hub is out of reach -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b5bd6"/><g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"><path d="M16 16 9 9M16 16l7-7M16 16v8"/></g><circle cx="16" cy="16" r="3.5" fill="#fff"/><circle cx="9" cy="9" r="2.3" fill="#fff"/><circle cx="23" cy="9" r="2.3" fill="#fff"/><circle cx="16" cy="24" r="2.3" fill="#fff"/></svg>
      <h1>Can't reach your hub</h1>
      <p>Check that this device is online and on the same network as the hub, and that the hub is running. Then try again.</p>
      <!-- an empty link is this page's own address: the one that failed, asked again -->
      <a href="" data-testid="offline-retry">Try again</a>
    </main>
  </body>
</html>
